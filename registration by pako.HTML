<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration by arsya pako</title>
</head>
<body bgcolor="beige">
    <form onsubmit="return checkCredentials(event)">
<div
    style="
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;">      
    <div>
        <font color="chocolate"><h1>registration</h1></font>
        <font color="chocolate"><h3>username</h3></font>
        <input type="text" id="usernameInput">
        <font color="chocolate"><h3>password</h3></font>
        <input type="password" id="passwordInput">
        <input type="checkbox" id="showPassowrdToggle" onclick="togglePasswordVisibility()">
        <label for="showPassowrdToggle">Show password</label>
    <div
        style="
    width: 100%;
    height: 10%;
    display: flex;
    justify-content: center;">
        <input type="submit"/>
    </div>
    </div>
</div>
    </form>
<script>
    function togglePasswordVisibility() {
        const passwordfield = document.getElementById('passwordInput');

        if (passwordfield.type === "password") {
            passwordfield.type = "text";
        } else {
            passwordfield.type = "password";
        }
    }
    function checkCredentials(event) {
        event.preventDefault();

        const username = document.getElementById('usernameInput').value;
        const password = document.getElementById('passwordInput').value;
        if (username === "arsya_pako" && password === "12345678") {
            window.location.href = "https://arsyapako-star.github.io/";
        } else{
            alert("incorrect username or password. Please try again!");
        }
    }
</script>
</body>
</html>
